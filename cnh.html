<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habilitação</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #1a1a1a;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* ===== CELULAR ===== */
.phone {
  width: 390px;
  height: 844px;
  background: #f2f2f2;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,.4);
}

/* ===== HEADER ===== */
.header {
  height: 110px;
  background: #0a2a5e;
  color: white;
  display: flex;
  align-items: flex-end;
  padding: 20px 16px;
}

.back {
  font-size: 26px;
  margin-right: 12px;
  cursor: pointer;
}

.header h1 {
  font-size: 20px;
}

/* ===== CONTENT ===== */
.content {
  padding: 16px;
}

/* TEXTO INFO */
.info {
  font-size: 13px;
  color: #555;
  text-align: center;
  margin-bottom: 12px;
}

.info b {
  color: #1a4fd8;
}

/* ===== CARROSSEL ===== */
.carousel {
  position: relative;
  overflow: hidden;
  background: white;
  box-shadow: 0 6px 16px rgba(0,0,0,.15);
  touch-action: pan-y;
  border-radius: 0; /* 🔴 SEM BORDA ARREDONDADA */
}

.carousel-track {
  display: flex;
  transition: transform .35s ease;
}

.slide {
  min-width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.slide img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 0; /* 🔴 IMAGEM QUADRADA */
}

/* DOTS */
.dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 12px 0;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ccc;
}

.dot.active {
  background: #0a2a5e;
}

/* ===== CARD ===== */
.card {
  margin-top: 20px;
  background: white;
  border-radius: 16px;
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 6px 16px rgba(0,0,0,.15);
  cursor: pointer;
}

.card span {
  font-weight: bold;
  color: #0a2a5e;
  font-size: 14px;
}
.header h1 {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
               "SF Pro Text", Helvetica, Arial, sans-serif;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.2px;
}
.icon4 {
  width: 20px;
  height: 20px;
  background-image: url("11.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}

</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="phone">

  <!-- HEADER -->
  <div class="header">
    <div class="back" onclick="history.back()">‹</div>
    <h1>HABILITAÇÃO</h1>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <div class="info">
      Verifique autenticidade do QR Code com o app <b>Vio</b>
    </div>

    <!-- CARROSSEL -->
    <div class="carousel" id="carousel">
      <div class="carousel-track" id="track">
        <div class="slide">
          <img src="cnh1.png">
        </div>
        <div class="slide">
          <img src="cnh2.png">
        </div>
        <div class="slide">
          <img src="cnh3.png">
        </div>
        <div class="slide">
          <img src="cnh4.png">
        </div>
      </div>
    </div>

    <div class="dots" id="dots"></div>

    <!-- CARD -->
    <div class="card">
 <div class="icon" style="color:#0a2a5e; font-size: 15px;"><i class="fa-solid fa-address-card"></i>
    </div>
      <span>Histórico de emissões da CNH</span>
    </div>
    <div class="card">
 <div class="icon4"></i>
    </div>
      <span>Exportar</span>
    </div>

  </div>
</div>

<script>
let index = 0;
const track = document.getElementById('track');
const slides = document.querySelectorAll('.slide');
const dotsContainer = document.getElementById('dots');
const carousel = document.getElementById('carousel');

let startX = 0;
let isDragging = false;

/* DOTS */
slides.forEach((_, i) => {
  const dot = document.createElement('div');
  dot.classList.add('dot');
  if (i === 0) dot.classList.add('active');
  dot.onclick = () => goTo(i);
  dotsContainer.appendChild(dot);
});

function update() {
  track.style.transform = `translateX(-${index * 100}%)`;
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === index);
  });
}

function goTo(i) {
  index = i;
  update();
}

function next() {
  if (index < slides.length - 1) {
    index++;
    update();
  }
}

function prev() {
  if (index > 0) {
    index--;
    update();
  }
}

/* TOUCH */
carousel.addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
  isDragging = true;
});

carousel.addEventListener('touchend', e => {
  if (!isDragging) return;
  handleSwipe(e.changedTouches[0].clientX);
  isDragging = false;
});

/* MOUSE */
carousel.addEventListener('mousedown', e => {
  startX = e.clientX;
  isDragging = true;
});

carousel.addEventListener('mouseup', e => {
  if (!isDragging) return;
  handleSwipe(e.clientX);
  isDragging = false;
});

function handleSwipe(endX) {
  const diff = startX - endX;
  const threshold = 50;

  if (diff > threshold) next();
  else if (diff < -threshold) prev();
}
</script>

</body>
</html>
