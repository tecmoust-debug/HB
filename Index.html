<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documento Digital (Mockup)</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    body {
      margin: 0;
      background: #dcdcdc;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    /* 📱 Container estilo celular */
    .phone {
      width: 390px;
      min-height: 844px;
      background: #f2f2f2;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
    }

    /* 🔵 Header */
    .header {
      background: #0a2a5e;
      color: white;
      padding: 20px 16px 24px;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .menu {
      font-size: 22px;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .name {
      margin-top: 12px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* 🧱 Cards */
    .content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      height: 110px;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 6px 20px rgba(0,0,0,.15);
      color: white;
      position: relative;
      overflow: hidden;
    }

    .card h3 {
      margin: 0;
      font-size: 16px;
      letter-spacing: .5px;
    }

    .card p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: .9;
    }

    .icon {
      font-size: 40px;
      opacity: .9;
    }

    /* 🎨 Cores dos cards */
    .green { background: #0fa958; }
    .yellow { background: #ffd23f; color: #1a1a1a; }
    .blue { background: #1e3a8a; }
    .lightblue { background: #6ec1f3; color: #1a1a1a; }

    /* 🧾 Rodapé */
    .footer {
      margin-top: 40px;
      padding: 20px;
      font-size: 11px;
      text-align: center;
      color: #666;
    }
  </style>
</head>

<body>
  <div class="phone">

    <!-- Header -->
    <div class="header">
      <div class="header-top">
        <div class="menu">☰</div>
        <div class="user">
          🔔
          <div class="avatar">J</div>
        </div>
      </div>
      <div class="name">JEAN</div>
    </div>

    <!-- Conteúdo -->
    <div class="content">

      <div class="card green">
        <div>
          <h3>CONDUTOR</h3>
          <p>Gerencie sua <b>habilitação</b></p>
        </div>
        <div class="icon">🚗</div>
      </div>

      <div class="card yellow">
        <div>
          <h3>VEÍCULOS</h3>
          <p>Acesso ao <b>CRLV-e</b>, venda digital</p>
        </div>
        <div class="icon">🚙</div>
      </div>

      <div class="card blue">
        <div>
          <h3>INFRAÇÕES</h3>
          <p>Visualize e pague com até <b>40% de desconto</b></p>
        </div>
        <div class="icon">🚓</div>
      </div>

      <div class="card lightblue">
        <div>
          <h3>EDUCAÇÃO</h3>
          <p>Conheça nossa <b>plataforma de cursos</b></p>
        </div>
        <div class="icon">🎓</div>
      </div>

    </div>

    <!-- Rodapé -->
    <div class="footer">
      Documento Digital • Mockup de Interface
    </div>

  </div>
</body>
</html>
